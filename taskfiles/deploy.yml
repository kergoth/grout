version: '3'

tasks:

  next:
    desc: Deploy to NextUI device via ADB
    cmds:
      - adb shell rm -rf /mnt/SDCARD/Tools/tg5040/Grout.pak
      - adb push dist/Grout.pak /mnt/SDCARD/Tools/tg5040
      - adb push config-platformless.json /mnt/SDCARD/Tools/tg5040/Grout.pak/config.json
    silent: true

  muos-sd1:
    desc: Deploy to muOS device via ADB (SD1)
    cmds:
      - adb shell rm -rf /mnt/mmc/MUOS/application/Grout
      - adb push dist/muOS/Grout /mnt/mmc/MUOS/application
      - adb push config-platformless.json /mnt/mmc/MUOS/application/Grout/config.json
    silent: true

  muos-sd2:
    desc: Deploy to muOS device via ADB (SD2)
    cmds:
      - adb shell rm -rf /mnt/sdcard/MUOS/application/Grout
      - adb push dist/muOS/Grout /mnt/sdcard/MUOS/application
      - adb push config-platformless.json /mnt/sdcard/MUOS/application/Grout/config.json
    silent: true

  emudeck:
    desc: Deploy to Steam Deck via SSH (EmuDeck ports)
    cmds:
      - >-
        ports_path=$(ssh steamdeck 'set -eu;
        settings="$HOME/.config/EmuDeck/settings.json";
        [ -f "$settings" ] || { echo "missing required path: $settings" >&2; exit 1; };
        storage_path=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get(\"storagePath\",\"\"))" "$settings");
        [ -n "$storage_path" ] || { echo "missing required value: storagePath in $settings" >&2; exit 1; };
        ports_path="$storage_path/Emulation/roms/ports";
        [ -d "$ports_path" ] || { echo "missing required path: $ports_path" >&2; exit 1; };
        printf "%s\n" "$ports_path"') &&
        rsync -av dist/EmuDeck/Grout.sh "steamdeck:${ports_path}/" &&
        rsync -av --delete dist/EmuDeck/Grout/ "steamdeck:${ports_path}/Grout/"
    silent: true

  retrodeck:
    desc: Deploy to Steam Deck via SSH (RetroDECK desktop)
    cmds:
      - >-
        desktop_path=$(ssh steamdeck 'set -eu;
        cfg="$HOME/.var/app/net.retrodeck.retrodeck/config/retrodeck/retrodeck.json";
        [ -f "$cfg" ] || { echo "missing required path: $cfg" >&2; exit 1; };
        roms_path=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get(\"paths\",{}).get(\"roms_path\",\"\"))" "$cfg");
        [ -n "$roms_path" ] || { echo "missing required value: paths.roms_path in $cfg" >&2; exit 1; };
        desktop_path="$roms_path/desktop";
        [ -d "$desktop_path" ] || { echo "missing required path: $desktop_path" >&2; exit 1; };
        printf "%s\n" "$desktop_path"') &&
        rsync -av dist/RetroDeck/Grout.sh "steamdeck:${desktop_path}/" &&
        rsync -av --delete dist/RetroDeck/Grout/ "steamdeck:${desktop_path}/Grout/"
    silent: true

  knulli:
    desc: Deploy to Knulli device via ADB
    cmds:
      - adb shell rm -rf /userdata/roms/ports/Grout
      - adb push dist/Knulli/Grout /userdata/roms/ports
      - adb push config-platformless.json /userdata/roms/ports/Grout/config.json
    silent: true
